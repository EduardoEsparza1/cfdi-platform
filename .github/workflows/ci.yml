
name: CFDI Platform CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore CfdiPlatform.slnx

      - name: Build solution
        run: dotnet build CfdiPlatform.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/CfdiPlatform.Domain.UnitTests/CfdiPlatform.Domain.UnitTests.csproj --configuration Release --no-restore
